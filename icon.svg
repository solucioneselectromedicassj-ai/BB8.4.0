<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Fondo -->
  <rect width="512" height="512" rx="112" fill="#0B1622"/>

  <!-- Grid lines sutiles -->
  <line x1="64" y1="180" x2="448" y2="180" stroke="#1C3048" stroke-width="2"/>
  <line x1="64" y1="256" x2="448" y2="256" stroke="#1C3048" stroke-width="2"/>
  <line x1="64" y1="332" x2="448" y2="332" stroke="#1C3048" stroke-width="2"/>

  <!-- Curva de contracción uterina (TOCO) — trazo principal en teal -->
  <!-- baseline → ascenso suave → pico → descenso suave → baseline -->
  <polyline
    points="
      64,332
      110,332
      130,328
      152,310
      178,268
      200,218
      216,192
      228,186
      240,184
      252,186
      264,196
      280,224
      304,272
      326,312
      346,328
      370,332
      448,332
    "
    fill="none"
    stroke="#00D98B"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Relleno degradado bajo la curva -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D98B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00D98B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <polygon
    points="
      64,332
      110,332
      130,328
      152,310
      178,268
      200,218
      216,192
      228,186
      240,184
      252,186
      264,196
      280,224
      304,272
      326,312
      346,328
      370,332
      448,332
      448,332
      64,332
    "
    fill="url(#grad)"
  />

  <!-- Pulso FCF encima — línea fina azul (heartbeat) -->
  <polyline
    points="
      64,200
      120,200
      136,200
      144,172
      152,200
      160,200
      168,200
      176,152
      184,248
      192,200
      208,200
      216,200
      224,178
      232,200
      248,200
      256,200
      264,178
      272,200
      288,200
    "
    fill="none"
    stroke="#4A9EFF"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.75"
  />

  <!-- Punto de pico — indicador teal brillante -->
  <circle cx="240" cy="184" r="10" fill="#00D98B" opacity="0.9"/>
  <circle cx="240" cy="184" r="18" fill="#00D98B" opacity="0.2"/>

  <!-- Etiqueta "SEM" pequeña en esquina inferior derecha -->
  <text x="430" y="464" font-family="monospace" font-size="36" font-weight="700"
    fill="#1C3048" text-anchor="end" letter-spacing="3">SEM</text>
</svg>
